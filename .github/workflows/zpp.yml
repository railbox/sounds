name: "ZPP test"

on:
  push:
    paths:
    - converters/zpp/**

jobs:
  zpp-run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ 3.9 }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pydub
    - uses: FedericoCarboni/setup-ffmpeg@v3
    - name: Parse test file
      working-directory: converters/zpp/tests
      run: python ../zpp.py test.zpp
    - name: Check output
      working-directory: converters/zpp/tests/test
      run: |
        test -f F1_LOOP_S0_T2292.wav
        test -f F63.wav
        test -f logic.txt
        if ! grep -q "F63_RAND_S40_E80_L5000_INMOVE" logic.txt; then
          echo "logic.txt check failed."
          exit 1
        fi
        cat logic.txt
